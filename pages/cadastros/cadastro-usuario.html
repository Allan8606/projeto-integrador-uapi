
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastre-se | P2 Conecta</title>

    <link rel="stylesheet" href="../../styles/cadastros/cadastro-usuario.css">
    <script src="../../js/cadastro-usuario.js" defer></script>
</head>
<body>

    <main class="pagina-cadastro">
        <section class="cadastro-box">

            <a href="../../index.html" class="logo">
                <img src="../../img/logo.webp"
                     alt="Logo P2 Conecta">
            </a>

            <h1>Crie sua conta</h1>

            <p class="subtitulo">
                Cadastre-se como empreendedor
                para gerenciar eventos no P2 Conecta.
            </p>

            <form id="formCadastro">

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text"
                           id="nome"
                           maxlength="100"
                           autocomplete="name"
                           required>
                </div>

                <div class="campo">
                    <label for="emailCadastro">E-mail</label>
                    <input type="email"
                           id="emailCadastro"
                           autocomplete="email"
                           required>
                </div>

                <div class="campo">
                    <label for="senhaCadastro">Senha</label>
                    <input type="password"
                           id="senhaCadastro"
                           minlength="8"
                           autocomplete="new-password"
                           required>
                    <small>Mínimo de 8 caracteres.</small>
                </div>

                <div class="campo">
                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>
                    <input type="password"
                           id="confirmarSenha"
                           minlength="8"
                           autocomplete="new-password"
                           required>
                </div>

                <button type="submit">
                    Criar conta
                </button>

                <p id="mensagemCadastro"
                   role="status"></p>

            </form>

            <p class="link-login">
                Já tem uma conta?
                <a href="../login.html">Entrar</a>
            </p>

            <a href="../../index.html" class="voltar">
                ← Voltar para o início
            </a>

        </section>
    </main>

</body>
</html>
